<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta name="description" content="A simple password generator" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="container">
      <h1>Password Generator</h1>

      <!----- PASSWORD CONTAINER----->
      <div class="pswd-container">
        <input type="text" id="password" readonly />
        <i class="far fa-copy" id="cpy-btn" title="Copy to clipboard"></i>
      </div>

      <!----- PASSWORD OPTIONS ----->
      <div class="options-container">
        <!----- LENGTH DIV ----->
        <div class="options">
          <label for="pswd-length">Password Length</label>
          <div class="pswd-length">
            <input type="range" id="slide" min="6" max="24" value="12" />
            <span id="length-value">12</span>
          </div>
        </div>

        <div class="options">
          <label for="uppercase">Include Uppercase</label>
          <input type="checkbox" id="uppercase" checked />
        </div>

        <div class="options">
          <label for="lowercase">Include Lowercase</label>
          <input type="checkbox" id="lowercase" />
        </div>

        <div class="options">
          <label for="numbers">Include Numbers</label>
          <input type="checkbox" id="numbers" />
        </div>

        <div class="options">
          <label for="symbols">Include Symbols</label>
          <input type="checkbox" id="symbols" />
        </div>
      </div>

      <button class="generate-btn">
        <i class="fas fa-key"></i>
        Generate Password
      </button>

      <div class="pswd-strength">
        <p>Password Strength <span id="strength-label">Medium</span></p>

        <div class="strength-meter">
          <div class="strength-bar"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
